// ==UserScript==
// @ScriptName        哔哩哔哩广告净化[Lite 修复版]
// @Desc              Quantumult X 可用。针对哔哩哔哩 iOS 8.98.1 移除 account/mine 改写，避免“历史记录”入口加载很慢。
// @Author            @ddgksf2013, fixed locally
// @UpdateTime        2026-06-16
// @Attention         如果广告仍然存在，请清除哔哩哔哩缓存或重启 App。
// ==/UserScript==

hostname = app.bilibili.com

^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/show url reject-200
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/bilibili_tmp.js
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/myinfo\? url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/bilibili_tmp.js
^https?:\/\/app\.bilibili\.com\/x\/v2\/feed\/index url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/bilibili_tmp.js
^https?:\/\/app\.bilibili\.com\/x\/resource\/show\/tab url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/bilibili_tmp.js
^https?:\/\/app\.bilibili\.com\/x\/resource\/top\/activity url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/bilibili_tmp.js
^https?:\/\/app\.bilibili\.com\/x\/v2\/search\/square url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/bilibili_tmp.js

// 修复说明：
// 原 Lite 规则包含：
// ^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/mine url script-response-body ...
// iOS 哔哩哔哩 8.98.1 下该接口继续改写会影响“我的”页里的历史记录入口，导致进入历史记录时出现长时间兼容加载。
// 因此本修复版只移除 account/mine 改写，其他去广告规则保持不变。
